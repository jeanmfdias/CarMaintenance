# Security response headers for the CarMaintenance SPA.
#
# nginx does NOT inherit `add_header` directives into a location once that
# location declares its own `add_header`. Several blocks here set Cache-Control,
# so this snippet is `include`d in each of them (and at the server level) to
# guarantee the headers land on every response — including the main document,
# which is served from `location = /index.html` via the SPA try_files fallback.
# `always` emits them on error responses too.
#
# CSP notes (Vue 3 + Vuetify + Vite PWA build):
#  - script-src 'self'      — the build emits only external hashed modules; no
#                             inline <script> in index.html.
#  - style-src 'unsafe-inline' — Vuetify injects inline styles at runtime.
#  - img-src data: blob:    — vehicle photos use object URLs (blob:) and icons
#                             may be inlined as data: URIs.
#  - connect-src 'self'     — the API and /uploads are same-origin via the proxy.
#  - worker-src 'self' blob: — the PWA service worker.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
