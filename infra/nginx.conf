server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve PWA entry files directly so they never hit the SPA fallback.
    location = /manifest.webmanifest {
        try_files $uri =404;
    }

    location = /registerSW.js {
        try_files $uri =404;
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ~* ^/workbox-.*\.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — route app requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|svg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not cache index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
