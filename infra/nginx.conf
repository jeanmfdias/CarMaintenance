server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for locations that don't declare their own add_header
    # (which would otherwise suppress inheritance). Repeated inside each block
    # below that sets Cache-Control — see infra/security-headers.conf.
    include /etc/nginx/snippets/security-headers.conf;

    # Serve PWA entry files directly so they never hit the SPA fallback.
    location = /manifest.webmanifest {
        try_files $uri =404;
    }

    location = /registerSW.js {
        try_files $uri =404;
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* ^/workbox-.*\.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback — route app requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|svg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Do not cache index.html. This block also serves the main document via the
    # SPA try_files fallback above, so the security headers must be repeated here.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
