upstream carm_frontend {
    server frontend:80;
}

upstream carm_backend {
    server backend:3001;
}

server {
    listen 80;
    server_name _;

    # Allow vehicle photo uploads up to ~10 MB (server caps single files at 8 MB).
    client_max_body_size 10m;

    # Backend API
    location /api/ {
        proxy_pass         http://carm_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Auth-gated user uploads served directly by the backend.
    location /uploads/ {
        proxy_pass         http://carm_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Backend healthcheck (handy for external monitors).
    location = /health {
        proxy_pass         http://carm_backend/health;
        access_log         off;
    }

    # Everything else -> static frontend (Vue SPA + PWA assets).
    location / {
        proxy_pass         http://carm_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
